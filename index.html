<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Companion</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-car"></i>
                <h1>Travel Companion</h1>
            </div>
            <div class="user-info" id="user-info">
                <div class="loader"></div>
            </div>
        </header>

        <main>
            <section class="welcome-screen active" id="welcome-screen">
                <div class="welcome-card">
                    <h2 id="welcome-title">👋 Добро пожаловать!</h2>
                    <p>Найдите попутчиков или создайте поездку</p>
                    
                    <div class="role-selector">
                        <button class="role-btn driver" onclick="showScreen('find-trip')">
                            <i class="fas fa-search"></i>
                            <span>Найти поездку</span>
                        </button>
                        <button class="role-btn passenger" onclick="showCreateTripWithMap()">
                            <i class="fas fa-map-marked-alt"></i>
                            <span>Создать поездку</span>
                        </button>
                    </div>
                    
                    <div class="stats">
                        <div class="stat-item">
                            <i class="fas fa-users"></i>
                            <span id="users-count">0</span>
                            <small>пользователей</small>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-route"></i>
                            <span id="trips-count">0</span>
                            <small>поездок</small>
                        </div>
                    </div>
                </div>
            </section>

            <section class="screen" id="find-trip" style="display: none;">
                <div class="screen-header">
                    <button class="back-btn" onclick="showScreen('welcome')">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2>🔍 Поиск поездки</h2>
                </div>
                
                <div class="search-form">
                    <div class="input-group" style="position: relative;">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="from-input" placeholder="Откуда" autocomplete="off">
                        <div id="suggestions-from" class="suggestions-container"></div>
                    </div>
                    
                    <div class="input-group" style="position: relative;">
                        <i class="fas fa-flag-checkered"></i>
                        <input type="text" id="to-input" placeholder="Куда" autocomplete="off">
                        <div id="suggestions-to" class="suggestions-container"></div>
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group half">
                            <i class="fas fa-calendar"></i>
                            <input type="date" id="date-input">
                        </div>
                        
                        <div class="input-group half">
                            <i class="fas fa-user-friends"></i>
                            <select id="passengers-input">
                                <option value="1">1 пассажир</option>
                                <option value="2">2 пассажира</option>
                                <option value="3">3 пассажира</option>
                                <option value="4">4 пассажира</option>
                            </select>
                        </div>
                    </div>
                    
                    <button class="search-btn">
                        <i class="fas fa-search"></i>
                        Найти поездки
                    </button>
                </div>
                
                <div class="results" id="search-results">
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>Введите параметры для поиска</p>
                    </div>
                </div>
            </section>

            <section class="screen" id="create-trip" style="display: none;">
                <div class="screen-header">
                    <button class="back-btn" onclick="showScreen('welcome')">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2>🚗 Создать поездку</h2>
                </div>
                
                <div class="trip-form">
                    <div class="form-section">
                        <h3><i class="fas fa-route"></i> Маршрут</h3>
                        
                        <div class="input-group" style="position: relative;">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" id="trip-from" placeholder="Откуда *" required autocomplete="off">
                            <div id="suggestions-trip-from" class="suggestions-container"></div>
                        </div>
                        
                        <div class="input-group" style="position: relative;">
                            <i class="fas fa-flag-checkered"></i>
                            <input type="text" id="trip-to" placeholder="Куда *" required autocomplete="off">
                            <div id="suggestions-trip-to" class="suggestions-container"></div>
                        </div>
                        
                        <button type="button" class="btn-small" style="width: 100%; margin: 10px 0;" onclick="swapRoutePoints()">
                            <i class="fas fa-exchange-alt"></i> Поменять местами
                        </button>
                    </div>
                    
                    <div class="form-section">
                        <h3><i class="fas fa-clock"></i> Дата и время</h3>
                        <div class="input-row">
                            <div class="input-group half">
                                <i class="fas fa-calendar"></i>
                                <input type="date" id="trip-date" required>
                            </div>
                            <div class="input-group half">
                                <i class="fas fa-clock"></i>
                                <input type="time" id="trip-time" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3><i class="fas fa-car"></i> Автомобиль</h3>
                        <div class="input-group">
                            <i class="fas fa-car-side"></i>
                            <input type="text" id="car-model" placeholder="Модель авто *">
                        </div>
                        <div class="input-row">
                            <div class="input-group half">
                                <i class="fas fa-users"></i>
                                <select id="seats-count" required>
                                    <option value="3" selected>3 места</option>
                                    <option value="4">4 места</option>
                                </select>
                            </div>
                            <div class="input-group half">
                                <i class="fas fa-money-bill-wave"></i>
                                <input type="number" id="trip-price" placeholder="Цена *" required>
                            </div>
                        </div>
                    </div>

                    <button class="submit-btn" onclick="createTrip()">
                        <i class="fas fa-paper-plane"></i> Опубликовать
                    </button>
                </div>
            </section>

            <section class="screen" id="create-trip-map" style="display: none;">
                <div class="screen-header">
                    <button class="back-btn" onclick="showScreen('welcome')">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2>🗺️ На карте</h2>
                </div>
                
                <div class="trip-form-map">
                    <div class="map-section">
                        <div class="map-search">
                            <div class="input-group" style="flex: 1; margin-bottom: 0; position: relative;">
                                <input type="text" id="map-search-input" placeholder="Найти адрес..." autocomplete="off">
                                <div id="map-suggestions" class="suggestions-container"></div>
                            </div>
                            <button id="map-search-btn"><i class="fas fa-search"></i></button>
                        </div>

                        <div id="yandex-map" style="width: 100%; height: 350px; border-radius: 8px;"></div>
                        
                        <div class="map-controls">
                            <button id="btn-set-start" class="map-btn active"><i class="fas fa-map-marker-alt"></i> Откуда</button>
                            <button id="btn-set-finish" class="map-btn"><i class="fas fa-flag-checkered"></i> Куда</button>
                        </div>
                    </div>
                    
                    <button class="submit-btn" style="margin-top: 20px;" onclick="createTripWithMap()">
                        <i class="fas fa-check"></i> Подтвердить маршрут
                    </button>
                </div>
            </section>

            <section class="screen" id="profile" style="display: none;">
                <div class="screen-header">
                    <button class="back-btn" onclick="showScreen('welcome')">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2>👤 Профиль</h2>
                </div>
                <div id="profile-data"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="showScreen('welcome')"><i class="fas fa-home"></i><span>Главная</span></button>
            <button class="nav-btn" onclick="showScreen('find-trip')"><i class="fas fa-search"></i><span>Поиск</span></button>
            <button class="nav-btn" onclick="showScreen('create-trip')"><i class="fas fa-plus-circle"></i><span>Создать</span></button>
            <button class="nav-btn" onclick="showScreen('profile')"><i class="fas fa-user"></i><span>Профиль</span></button>
        </nav>
    </div>

    <script src="https://api-maps.yandex.ru/2.1/?apikey=46046ee2-ef66-47ae-b570-ca0680738074&lang=ru_RU&load=package.full&v=1.1"></script>
    <script src="yandex-maps.js"></script>
    <script src="app.js"></script>    
    <script src="trip-route-map.js"></script>
</body>
</html>
