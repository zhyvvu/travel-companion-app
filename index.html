<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Companion</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-car"></i>
                <h1>Travel Companion</h1>
            </div>
            <div class="user-info" id="user-info">
                <span id="user-name">Загрузка...</span>
            </div>
        </header>

        <main>
            <section class="screen active" id="welcome">
                <div class="welcome-card">
                    <h2 id="welcome-title">👋 Добро пожаловать!</h2>
                    <p>Найдите попутчиков или создайте поездку</p>
                    
                    <div class="role-selector">
                        <button class="role-btn passenger" onclick="showScreen('find-trip')">
                            <i class="fas fa-search"></i>
                            <span>Найти поездку</span>
                        </button>
                        <button class="role-btn driver" onclick="showScreen('create-trip-map')">
                            <i class="fas fa-map-marked-alt"></i>
                            <span>Создать поездку</span>
                        </button>
                    </div>
                    
                    <div class="stats">
                        <div class="stat-item">
                            <i class="fas fa-users"></i>
                            <span id="users-count">0</span>
                            <small>пользователей</small>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-route"></i>
                            <span id="trips-count">0</span>
                            <small>поездок</small>
                        </div>
                    </div>
                </div>
            </section>

            <section class="screen" id="find-trip" style="display: none;">
                <div class="screen-header">
                    <button class="back-btn" onclick="showScreen('welcome')">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2>🔍 Поиск поездки</h2>
                </div>
                
                <div class="search-form">
                    <div class="input-group" style="position: relative;">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="find-from" placeholder="Откуда" autocomplete="off">
                        <div id="find-from-suggestions" class="city-suggestions"></div>
                    </div>
                    
                    <div class="input-group" style="position: relative;">
                        <i class="fas fa-flag-checkered"></i>
                        <input type="text" id="find-to" placeholder="Куда" autocomplete="off">
                        <div id="find-to-suggestions" class="city-suggestions"></div>
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group half">
                            <i class="fas fa-calendar"></i>
                            <input type="date" id="find-date">
                        </div>
                        <div class="input-group half">
                            <i class="fas fa-user-friends"></i>
                            <select id="find-passengers">
                                <option value="1">1 чел</option>
                                <option value="2">2 чел</option>
                                <option value="3">3 чел</option>
                                <option value="4">4 чел</option>
                            </select>
                        </div>
                    </div>
                    
                    <button class="search-btn" onclick="searchTrips()">
                        <i class="fas fa-search"></i> Найти поездки
                    </button>
                </div>
                
                <div class="results" id="search-results">
                    <div class="empty-state">
                        <p>Введите параметры для поиска</p>
                    </div>
                </div>
            </section>

            <section class="screen" id="create-trip-map" style="display: none;">
                <div class="screen-header">
                    <button class="back-btn" onclick="showScreen('welcome')">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2>🗺️ Маршрут поездки</h2>
                </div>
                
                <div class="trip-form-map">
                    <div class="map-section">
                        <div class="map-search">
                            <div class="input-group" style="flex: 1; margin-bottom: 0; position: relative;">
                                <input type="text" id="map-search-input" placeholder="Поиск адреса..." autocomplete="off">
                                <div id="map-search-input-suggestions" class="city-suggestions"></div>
                            </div>
                            <button id="map-search-btn" type="button"><i class="fas fa-search"></i></button>
                        </div>

                        <div id="yandex-map" class="map-container" style="height: 300px; width: 100%;"></div>
                        
                        <div class="selected-points">
                            <div class="point-item">
                                <i class="fas fa-circle" style="color: #4CAF50; font-size: 10px;"></i>
                                <span id="start-address-val">Не выбрано</span>
                            </div>
                            <div class="point-item">
                                <i class="fas fa-circle" style="color: #F44336; font-size: 10px;"></i>
                                <span id="finish-address-val">Не выбрано</span>
                            </div>
                        </div>

                        <div class="map-controls">
                            <button id="btn-set-start" class="map-btn active" onclick="setMapMode('start')">
                                <i class="fas fa-map-marker-alt"></i> Откуда
                            </button>
                            <button id="btn-set-finish" class="map-btn" onclick="setMapMode('finish')">
                                <i class="fas fa-flag-checkered"></i> Куда
                            </button>
                            <button id="btn-clear-route" class="map-btn danger" onclick="clearMapRoute()">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div id="route-info" class="route-summary-badge" style="display: none;">
                        <i class="fas fa-info-circle"></i> 
                        <span id="route-distance">0</span> км | ~<span id="route-duration">0</span> мин
                    </div>

                    <div class="trip-details-fields">
                        <div class="input-row">
                            <div class="input-group half">
                                <label>Дата</label>
                                <i class="fas fa-calendar"></i>
                                <input type="date" id="trip-date-map" required>
                            </div>
                            <div class="input-group half">
                                <label>Время</label>
                                <i class="fas fa-clock"></i>
                                <input type="time" id="trip-time-map" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group half">
                                <label>Мест</label>
                                <i class="fas fa-users"></i>
                                <select id="seats-count-map">
                                    <option value="1">1 место</option>
                                    <option value="2">2 места</option>
                                    <option value="3" selected>3 места</option>
                                    <option value="4">4 места</option>
                                </select>
                            </div>
                            <div class="input-group half">
                                <label>Цена (₽)</label>
                                <i class="fas fa-money-bill-wave"></i>
                                <input type="number" id="trip-price-map" placeholder="Цена" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-comment"></i>
                            <input type="text" id="trip-comment-map" placeholder="Комментарий (модель авто, багаж)">
                        </div>
                    </div>

                    <button class="submit-btn" onclick="createTripWithMap()">
                        <i class="fas fa-paper-plane"></i> Опубликовать
                    </button>
                </div>
            </section>

            <section class="screen" id="profile" style="display: none;">
                <div class="screen-header">
                    <button class="back-btn" onclick="showScreen('welcome')">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2>👤 Профиль</h2>
                </div>
                <div id="profile-data" class="profile-card">
                    </div>
            </section>
        </main>

        <div id="modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-btn active" id="nav-welcome" onclick="showScreen('welcome')">
                <i class="fas fa-home"></i><span>Главная</span>
            </button>
            <button class="nav-btn" id="nav-find" onclick="showScreen('find-trip')">
                <i class="fas fa-search"></i><span>Поиск</span>
            </button>
            <button class="nav-btn" id="nav-create" onclick="showScreen('create-trip-map')">
                <i class="fas fa-plus-circle"></i><span>Создать</span>
            </button>
            <button class="nav-btn" id="nav-profile" onclick="showScreen('profile')">
                <i class="fas fa-user"></i><span>Профиль</span>
            </button>
        </nav>
    </div>

    <script src="https://api-maps.yandex.ru/2.1/?apikey=46046ee2-ef66-47ae-b570-ca0680738074&lang=ru_RU" type="text/javascript"></script>
    <script src="app.js"></script>     
    <script src="yandex-maps.js"></script>
</body>
</html>
